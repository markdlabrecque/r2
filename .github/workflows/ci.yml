name: CI

on:
  pull_request:
  push:
    branches: [main, spike-1]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci
      - name: Factory configuration tests
        run: npm run test:factory
      - name: Application checks
        shell: bash
        run: |
          set -euo pipefail
          if [ -f src/main.ts ]; then
            npm run typecheck
            npm run build
            npm test
          fi
      - name: Chromium browser tests
        shell: bash
        run: |
          set -euo pipefail
          if [ -f playwright.config.ts ]; then
            npx --no-install playwright install --with-deps chromium
            npm run test:browser
          fi
