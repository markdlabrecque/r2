<!doctype html>
<!-- Factory tracker board/evidence shell: per-ticket dots and centered connectors, solid green/red current dots
     with halos and sonar pulses, explicit queue reasons, latest-ten collapsible Shipped and real-history stats.
     Stats return focus to the invoking control, with a fallback for removed/hidden tickets.
     Current assessments always show an explicit unchecked state when absent, distinct from refresh/analysis pending
     and failed checks. They show selection, pending dependency analysis and fail-closed dependency checks separately
     from historical results. Refresh runs a short-lived read-only command, even when scheduling is off.
     Legacy history is marked incomplete; stopped tickets remain unfinished. Light, dark and system appearance
     (saved in the browser as sandcastle-theme). The HTTP board polls /api/runs every 10s and patches run cards by
     BoardRun.key with FLIP motion, so focus, scroll and filters survive updates. A local board.html is a static snapshot
     with no polling. Evidence pages never poll. All motion respects prefers-reduced-motion, live.
     Code between "// <name>:start" and "// <name>:end" markers is loaded by board.test.mts with stubbed DOM boundaries where needed. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Factory · Operations</title>
<script>
(function () {
  var root = document.documentElement, mode;
  try { mode = localStorage.getItem('sandcastle-theme'); } catch (_) {}
  if (['light', 'dark', 'system'].indexOf(mode) < 0) mode = 'system';
  root.dataset.mode = mode;
  root.dataset.theme = mode === 'system' ? (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : mode;
})();
</script>
<style>
  /* ---------- tokens: one design, light and dark ---------- */
  :root {
    --bg: #edf2f8; --grid: rgba(0, 92, 128, .055); --panel: #ffffff; --panel-2: #f3f7fa; --line: #b7c5d5; --line-strong: #6d8098;
    --ink: #0c1a25; --soft: #4a5f70; --faint: #6f8394;
    --accent: #006e6a; --accent-soft: rgba(0, 110, 106, .10); --on-accent: #ffffff;
    --run: #006b8f; --run-soft: rgba(0, 107, 143, .10);
    --wait: #855600; --wait-soft: rgba(176, 116, 0, .13);
    --bad: #b3202e; --bad-soft: rgba(179, 32, 46, .10);
    --ok: #146c46; --ok-soft: rgba(20, 108, 70, .12);
    --shadow: 0 1px 2px rgba(12, 26, 37, .06), 0 10px 28px rgba(12, 26, 37, .07);
    --glow: rgba(0, 107, 143, .22);
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --ease: cubic-bezier(.2, .8, .2, 1);
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #0a111c; --grid: rgba(79, 216, 255, .045); --panel: #101c2c; --panel-2: #152236; --line: #34465d; --line-strong: #637b98;
    --ink: #e5eefb; --soft: #a4b6cd; --faint: #91a5bd;
    --accent: #5ae2da; --accent-soft: rgba(90, 226, 218, .10); --on-accent: #03121a;
    --run: #4fd8ff; --run-soft: rgba(79, 216, 255, .10);
    --wait: #f2b84b; --wait-soft: rgba(242, 184, 75, .12);
    --bad: #ff6676; --bad-soft: rgba(255, 102, 118, .12);
    --ok: #4ade9b; --ok-soft: rgba(74, 222, 155, .11);
    --shadow: 0 0 0 1px rgba(79, 216, 255, .03), 0 14px 34px rgba(0, 0, 0, .5);
    --glow: rgba(79, 216, 255, .30);
    color-scheme: dark;
  }

  /* ---------- shell ---------- */
  *, *::before, *::after { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0; min-height: 100vh; color: var(--ink); font: 15px/1.45 var(--sans);
    background: var(--bg);
    transition: background-color .18s ease, color .18s ease;
  }
  a { color: var(--accent); text-underline-offset: 3px; }
  a:hover { text-decoration-thickness: 2px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .mono { font-family: var(--mono); }

  .app-nav { position: sticky; top: 0; z-index: 20; border-bottom: 1px solid var(--line); view-transition-name: factory-nav;
    background: color-mix(in srgb, var(--bg) 84%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .nav-inner { max-width: 1440px; margin: auto; padding: 8px 16px; display: flex; align-items: center; gap: 6px 14px; flex-wrap: wrap; min-height: 60px; }
  .brand { display: inline-flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; font: 700 13px/1 var(--sans); letter-spacing: .18em; text-transform: uppercase; }
  .brand svg { width: 28px; height: 28px; color: var(--accent); flex: none; }
  .brand:hover { color: var(--accent); }
  .app-nav [aria-current="page"] { color: var(--ink); }
  .crumb { display: inline-flex; align-items: center; gap: 14px; font: 600 12px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; text-decoration: none; min-width: 0; overflow-wrap: anywhere; }
  .crumb::before { content: ""; width: 1px; height: 18px; background: var(--line-strong); }
  .crumb[hidden] { display: none; }
  .nav-tools { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .sync { display: inline-flex; align-items: center; gap: 8px; font: 500 12px/1.2 var(--mono); color: var(--soft); white-space: nowrap; }
  .sync b { font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink); }
  .sync .lamp { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
  .sync[data-state="live"] .lamp { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); }
  .sync[data-state="offline"] .lamp { background: var(--bad); box-shadow: 0 0 0 3px var(--bad-soft); }
  .sync[data-state="offline"] b { color: var(--bad); }
  .sync[data-state="snapshot"] .lamp { background: var(--wait); }
  .icon-btn { display: grid; place-items: center; width: 44px; height: 44px; padding: 0; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; cursor: pointer; transition: border-color .15s ease, color .15s ease, background-color .18s ease; }
  .icon-btn:hover { border-color: var(--accent); color: var(--accent); }
  .icon-btn svg { width: 20px; height: 20px; }
  #app { max-width: 1440px; margin: 0 auto; padding: 0 16px 64px; }

  /* ---------- panels ---------- */
  .panel { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; box-shadow: none; min-width: 0;
    transition: background-color .18s ease, border-color .18s ease; }
  .panel::before { content: none; }
  .eyebrow { margin: 0; font: 600 11px/1.2 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--accent); }

  /* ---------- board header + summary ---------- */
  .hero { padding: 30px 0 18px; display: flex; gap: 12px 24px; align-items: flex-end; flex-wrap: wrap; }
  .hero h1 { margin: 6px 0 0; font: 700 24px/1.2 var(--mono); letter-spacing: -.02em; }
  .hero .lede { margin: 8px 0 0; color: var(--soft); max-width: 62ch; }
  .summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .tile { padding: 14px 16px 14px 18px; overflow: hidden; }
  .tile::after { content: ""; position: absolute; left: 0; top: 12px; bottom: 12px; width: 3px; border-radius: 0 3px 3px 0; background: var(--tone, var(--accent)); }
  .tile[data-tone="run"] { --tone: var(--run); }
  .tile[data-tone="wait"] { --tone: var(--wait); }
  .tile[data-tone="bad"] { --tone: var(--bad); }
  .tile[data-tone="ok"] { --tone: var(--ok); }
  .tile .lbl { font: 600 11px/1.2 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--soft); }
  .tile .num { display: block; margin-top: 6px; font: 700 38px/1 var(--sans); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .tile[data-tone="bad"][data-hot="true"] .num { color: var(--bad); }
  .tile .cap { display: block; margin-top: 6px; font-size: 12px; color: var(--faint); }

  .toolbar { margin: 18px 0 6px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
  .seg-group { display: inline-flex; flex-wrap: wrap; gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
  .seg-group button { font: 600 13px/1 var(--sans); color: var(--soft); background: transparent; border: 0; border-radius: 5px; padding: 9px 12px; cursor: pointer; min-height: 36px;
    transition: background-color .15s ease, color .15s ease; }
  .seg-group button:hover { color: var(--ink); background: var(--panel-2); }
  .seg-group button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
  .seg-group button b { font: 600 11px/1 var(--mono); margin-left: 6px; opacity: .75; }
  .project-filter { display: inline-flex; align-items: center; gap: 8px; font: 600 11px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--soft); }
  .project-filter[hidden] { display: none; }
  .project-filter select { font: 500 13px/1.2 var(--sans); color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; min-height: 36px; max-width: 60vw; text-transform: none; letter-spacing: 0; }

  /* ---------- operations layout ---------- */
  .ops { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px 22px; align-items: start; }
  #sec-history { border-top: 1px solid var(--line-strong); margin-top: 20px; }
  #sec-history > summary { cursor: pointer; list-style: none; }
  #sec-history > summary::before { content: '▸'; }
  #sec-history[open] > summary::before { content: '▾'; }
  .ops section { min-width: 0; }
  .sec-head { display: flex; align-items: center; gap: 12px; margin: 22px 0 12px; font: 600 12px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--soft); }
  .sec-head h2 { margin: 0; font: inherit; color: var(--ink); }
  .sec-head h2:focus { outline: none; }
  .sec-head h2:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
  .sec-head::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--line-strong), transparent); }
  .sec-head .n { font-variant-numeric: tabular-nums; }
  .cards { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 1280px) { #sec-history .cards { grid-template-columns: minmax(0, 1fr); } }
  .empty { margin: 0; padding: 18px; border: 1px dashed var(--line-strong); border-radius: 6px; color: var(--soft); font-size: 13px; }
  .empty[hidden] { display: none; }

  /* ---------- run card ---------- */
  .card { display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; overflow-wrap: anywhere; }
  .card[hidden] { display: none; }
  .card[data-tone="run"] { --tone: var(--run); --tone-soft: var(--run-soft); }
  .card[data-tone="wait"] { --tone: var(--wait); --tone-soft: var(--wait-soft); }
  .card[data-tone="bad"] { --tone: var(--bad); --tone-soft: var(--bad-soft); border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
  .card[data-tone="ok"] { --tone: var(--ok); --tone-soft: var(--ok-soft); }
  .card-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font: 600 12px/1.3 var(--mono); }
  .card-top .tid { color: var(--accent); }
  .card-top .proj { color: var(--soft); min-width: 0; }
  .status { margin-left: auto; display: inline-flex; align-items: center; gap: 7px; padding: 4px 9px; border-radius: 99px; background: var(--tone-soft); color: var(--tone);
    font: 700 11px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; }
  .status .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
  .card h3 { margin: 0; font: 650 16px/1.3 var(--sans); }
  .ticket-select { cursor: pointer; background: none; border: 0; color: inherit; font: inherit; padding: 0; text-align: left; }
  .ticket-select:hover { color: var(--accent); }
  .queue-reasons { list-style: none; margin: 0; padding: 0; color: var(--wait); font-size: 13px; }
  .queue-reasons li::before { content: '↳ '; }
  .queue-reasons[hidden] { display: none; }
  .stats-button { align-self: flex-end; cursor: pointer; font: 600 12px var(--sans); padding: 6px 10px; color: var(--accent); background: var(--panel-2); border: 1px solid var(--line-strong); border-radius: 4px; }
  .card { --stage-color: var(--ok); }
  .card[data-health="bad"] { --stage-color: var(--bad); }
  .card[data-unknown="true"] { --stage-color: var(--soft); }
  @media (min-width: 950px) {
    .card:not(.ev-hero) { display: grid; grid-template-columns: minmax(260px, 1fr) minmax(350px, 1.4fr); gap: 8px 30px; }
    .card:not(.ev-hero) > .card-top, .card:not(.ev-hero) > h3, .card:not(.ev-hero) > .queue-reasons { grid-column: 1; }
    .card:not(.ev-hero) > .pipe { grid-column: 2; grid-row: 1 / span 3; align-self: center; }
    .card:not(.ev-hero) > .stage-unknown { grid-column: 2; }
    .card:not(.ev-hero) > .facts, .card:not(.ev-hero) > .note, .card:not(.ev-hero) > .activity, .card:not(.ev-hero) > .assessment { grid-column: 1 / -1; }
    .card:not(.ev-hero) > .card-foot { grid-column: 1; }
    .card:not(.ev-hero) > .stats-button { grid-column: 2; justify-self: end; }
  }
  .facts { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 3px 10px; font: 12px/1.45 var(--mono); color: var(--soft); }
  .facts dt { color: var(--faint); text-transform: uppercase; letter-spacing: .08em; font-size: 10.5px; padding-top: 1px; }
  .facts dd { margin: 0; min-width: 0; }
  .facts [hidden] { display: none; }
  .note { margin: 0; padding: 8px 10px; border-left: 2px solid var(--tone); background: var(--tone-soft); border-radius: 0 4px 4px 0; font-size: 13px; }
  .note[hidden] { display: none; }
  .activity { margin: 0; font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .activity[hidden] { display: none; }
  .assessment { margin: 0; padding: 8px 10px; border: 1px solid var(--line-strong); border-radius: 4px; font-size: 12px; color: var(--soft); display: grid; gap: 3px; }
  .assessment[hidden] { display: none; }
  .assessment .a-title { font: 700 10.5px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
  .assessment .a-bad { color: var(--bad); }
  .assessment .a-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .card-foot { display: flex; align-items: center; gap: 8px 14px; flex-wrap: wrap; }
  .card-foot:empty { display: none; }
  .verdict { font: 700 11px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; padding: 5px 8px; border-radius: 4px; border: 1px solid currentColor; }
  .verdict.pass { color: var(--ok); }
  .verdict.fail { color: var(--bad); }
  .links { display: flex; gap: 6px 14px; flex-wrap: wrap; font: 600 12.5px/1.6 var(--sans); }
  .links:empty { display: none; }

  /* Tracker: border-box dots and connectors share a vertical center. */
  .pipe { display: flex; padding: 8px 0; }
  .pipe .seg { position: relative; flex: 1; min-width: 0; text-align: center; }
  .pipe i { position: relative; z-index: 1; display: block; width: 10px; height: 10px; margin: 3px auto 8px; border: 2px solid var(--line-strong); border-radius: 50%; background: var(--panel); }
  .pipe .seg:not(:last-child)::after { content: ''; position: absolute; left: calc(50% + 5px); width: calc(100% - 10px); top: 7px; height: 2px; background: var(--line-strong); }
  .pipe small { display: block; font: 600 10px/1.2 var(--mono); color: var(--soft); }
  .pipe .seg.done i, .pipe .seg.connected::after { background: var(--accent); border-color: var(--accent); }
  .pipe .seg.now i { background: var(--stage-color); border-color: var(--stage-color); box-shadow: 0 0 10px color-mix(in srgb, var(--stage-color) 45%, transparent), 0 0 22px color-mix(in srgb, var(--stage-color) 20%, transparent); }
  .pipe .seg.now i::after { content: ''; position: absolute; inset: -2px; border: 1px solid var(--stage-color); border-radius: 50%; pointer-events: none; animation: sonar 1.8s linear infinite; }
  .pipe .seg.now small { color: var(--ink); font-weight: 700; }
  .card[data-group="history"] .pipe { display: none; }
  .stage-unknown { display: flex; align-items: center; gap: 10px; font: 12px var(--mono); color: var(--soft); }
  .stage-unknown[hidden] { display: none; }
  .stage-unknown::before { content: ''; width: 10px; height: 10px; flex: none; border-radius: 50%; background: var(--stage-color); box-shadow: 0 0 12px color-mix(in srgb, var(--stage-color) 40%, transparent); }
  @keyframes sonar { from { transform: scale(0); opacity: .65; } to { transform: scale(3.2); opacity: 0; } }
  :root[data-hidden="true"] .pipe .seg.now i::after { animation-play-state: paused; }

  /* data-change cues, triggered from script and skipped under reduced motion */
  .card.flash { animation: flash .9s var(--ease); }
  .card.flash .pipe .seg.now small { color: var(--stage-color); }
  @keyframes flash { from { box-shadow: 0 0 0 1px var(--tone), 0 0 26px var(--glow); } }
  @keyframes sweep { from { transform: scaleX(0); } }
  .ghost { pointer-events: none; }

  .site-foot { margin-top: 34px; padding-top: 12px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px 20px; font: 12px/1.5 var(--mono); color: var(--soft); }

  /* ---------- evidence ---------- */
  .ev-hero { margin-top: 26px; padding: 20px 22px; display: grid; gap: 14px; }
  .ev-hero h1 { margin: 0; font: 700 clamp(24px, 3.4vw, 34px)/1.1 var(--sans); letter-spacing: -.015em; }
  .ev-hero .sub { color: var(--soft); font: 13px/1.4 var(--mono); }
  .ev-hero .status { margin-left: 0; justify-self: start; }
  .ev-hero .note { max-width: 90ch; }
  .back { font-weight: 700; text-decoration: none; }
  .back:hover { text-decoration: underline; }
  .ev-grid { margin-top: 18px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 14px; }
  .ev-card { padding: 14px; display: flex; flex-direction: column; gap: 10px; overflow-wrap: anywhere; }
  .ev-card h2 { margin: 0; font: 600 13px/1.35 var(--mono); }
  .ev-card img, .ev-card video { display: block; width: 100%; max-height: 65vh; object-fit: contain; background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; }
  .ev-card pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font: 12.5px/1.5 var(--mono); max-height: 65vh; overflow: auto; padding: 10px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; }
  .ev-card .sub { margin: 0; color: var(--soft); font-size: 12px; }

  /* ---------- ticket stats ---------- */
  .ticket-stats { margin: 0 0 0 auto; width: min(540px, 100%); max-width: 100%; height: 100dvh; max-height: 100dvh; padding: 24px; border: 1px solid var(--line-strong); color: var(--ink); background: var(--panel); box-shadow: var(--shadow); }
  .ticket-stats::backdrop { background: rgba(2, 8, 14, .55); }
  .stats-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; position: sticky; top: -24px; padding: 12px 0; background: var(--panel); z-index: 2; }
  .stats-head h2 { margin: 0; font: 600 15px var(--mono); }
  .ticket-stats h3 { font-size: 15px; margin: 20px 0 10px; }
  .ticket-stats .stats-title { font-size: 20px; }
  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 18px 0; }
  .stat { border: 1px solid var(--line-strong); border-radius: 4px; padding: 12px; }
  .stat span { display: block; color: var(--soft); font-size: 12px; }
  .stat b { display: block; margin-top: 4px; font: 600 21px var(--mono); }
  .ticket-stats table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .ticket-stats th, .ticket-stats td { text-align: left; border-bottom: 1px solid var(--line); padding: 8px 0; }
  .ticket-stats th:last-child, .ticket-stats td:last-child { text-align: right; }
  .stats-history { list-style: none; margin: 0; padding: 0; font-size: 13px; }
  .stats-history li { padding: 8px 0; border-bottom: 1px solid var(--line); }
  .stats-history small { display: block; color: var(--soft); }
  .stats-note { color: var(--soft); font-size: 12px; }

  /* ---------- appearance drawer ---------- */
  .scrim { position: fixed; inset: 0; z-index: 40; background: rgba(2, 8, 14, .45); opacity: 0; pointer-events: none; transition: opacity .24s ease; }
  .settings { position: fixed; z-index: 50; top: 0; right: 0; bottom: 0; width: min(360px, 100vw); background: var(--panel); color: var(--ink); border-left: 1px solid var(--line);
    box-shadow: -18px 0 40px rgba(0, 0, 0, .22); transform: translateX(105%); visibility: hidden; display: flex; flex-direction: column; overflow-y: auto;
    transition: transform .24s var(--ease), visibility 0s linear .24s; }
  .settings-open .scrim { opacity: 1; pointer-events: auto; }
  .settings-open .settings { transform: none; visibility: visible; transition: transform .24s var(--ease), visibility 0s; }
  .settings-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--line); }
  .settings-head h2 { margin: 0; font: 700 13px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase; }
  .settings fieldset { position: relative; border: 0; margin: 0; padding: 18px 20px 6px; min-width: 0; }
  .settings legend { float: left; width: 100%; padding: 0; margin-bottom: 10px; font: 600 11px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--soft); }
  .settings input { position: absolute; top: 0; left: 0; opacity: 0; pointer-events: none; }
  .modes { clear: both; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 8px; padding: 4px; gap: 4px; }

  // assessment:start

  function renderAssessment(c, run, now) {
    var a = run.assessment, f = a && a.facts;
    c.refresh.hidden = fileMode;
    c.assess.hidden = false;
    if (!a) {
      c.assess.replaceChildren(el('span', 'a-title', 'Current ticket: not checked yet'));

    }

      if (f.model) line.appendChild(el('span', null, 'Model ' + f.model));

    } else rows.push(el('div', null, 'Not checked yet'));
    if (a.pending) rows.push(el('div', null, 'Refresh requested: checking current tracker facts.'));
    if (a.analysisState === 'pending') rows.push(el('div', null, 'Pending analysis: dependency conclusions are stale until read-only analysis completes.'));
    if (a.analysisState === 'error') rows.push(el('div', 'a-bad', 'Dependency analysis failed: ' + a.analysisError + '. Previous conclusions are stale.'));
    if (a.analysisState === 'current' && a.dependencies) a.dependencies.forEach(function (d) {
      rows.push(el('div', d.state === 'satisfied' ? null : 'a-bad', 'Dependency ' + (d.iid == null ? 'unresolved / human-only' : '#' + d.iid) + ': ' + d.state + (d.what ? ' (' + d.what + ')' : '')));

    if (a.retryRequired) rows.push(el('div', 'a-bad', a.retryRequired));
    if (a.error) rows.push(el('div', 'a-bad', 'Last check failed ' + ago(a.attemptedAt, now) + ' ago: ' + a.error + (f ? ' Showing the last good check.' : '')));

  // assessment:end

  function updateCard(c, run, now) {
    var info = stageInfo(run.stage), quiet = isQuiet(run, now);
    c.el.dataset.key = run.key;
    c.el.dataset.health = needsAttention(run, now) ? 'bad' : 'good';
    c.el.dataset.tone = quiet ? 'bad' : info.tone;
    c.el.dataset.group = info.group;
    c.el.dataset.unknown = String(info.unknown);
    c.proj.textContent = run.project || '';
    c.statusText.textContent = quiet ? info.label + ' · quiet' : info.label;
    c.title.textContent = run.title || run.key;
    var step = trackerStep(run);
    c.segs.forEach(function (s, i) {
      s.classList.toggle('done', i < step || run.stage === 'done');
      s.classList.toggle('connected', i < step);
      s.classList.toggle('now', i === step && run.stage !== 'done');
    });
    c.pipe.setAttribute('aria-label', step >= 0 ? info.label + ' at ' + PATH_LABELS[step] + ', stage ' + (step + 1) + ' of ' + PATH.length : info.label + '. Stage unavailable');
    c.unknownStage.hidden = step >= 0 || run.stage === 'done';
    c.reasons.hidden = run.stage !== 'queued' && run.stage !== 'waiting';
    if (!c.reasons.hidden) {
      var reasonNodes = queueReasons(run).map(function (r) { return el('li', null, r.text); });
      c.reasons.replaceChildren.apply(c.reasons, reasonNodes);
    }
    var b = run.branch ? run.branch + (run.base ? ' → ' + run.base : '') : '';
    c.branch.dd.textContent = b;
    c.branch.dt.hidden = c.branch.dd.hidden = !b;
    var t;
    if (run.stage === 'queued' || run.stage === 'waiting') t = (run.stage === 'waiting' ? 'blocked ' : 'queued ') + ago(run.stageSince, now);
    else if (run.stage === 'done' || run.stage === 'stopped') t = (run.stage === 'stopped' ? 'stopped ' : 'completed ') + ago(run.stageSince, now) + ' ago · started ' + ago(run.startedAt, now) + ' ago';
    else t = 'in stage ' + ago(run.stageSince, now) + ' · started ' + ago(run.startedAt, now) + ' ago';
    if (quiet) t += ' · last update ' + ago(run.updatedAt, now) + ' ago · pid ' + run.pid;
    c.timing.dd.textContent = t;
    c.note.textContent = run.note || '';
    c.note.hidden = !run.note || run.stage === 'queued' || run.stage === 'waiting';
    c.activity.textContent = run.activity || '';
    c.activity.title = run.activity ? 'Latest agent output, ' + ago(run.activityAt, now) + ' ago' : '';
    c.activity.hidden = !run.activity;
    renderAssessment(c, run, now);
    // Links are rebuilt only when they change, so a focused link survives a refresh.
    var sig = JSON.stringify([run.iid, run.ticketUrl, run.mr, run.evidenceUrl, run.verdict]);
    if (sig !== c.sig) {
      c.sig = sig;
      c.tid.replaceChildren(run.ticketUrl ? link(run.ticketUrl, ticketLabel(run)) : document.createTextNode(ticketLabel(run)));
      c.foot.replaceChildren();
      if (run.verdict) c.foot.appendChild(el('span', 'verdict ' + (run.verdict === 'PASS' ? 'pass' : 'fail'), run.verdict === 'PASS' ? 'Verified' : run.verdict));
      var links = el('div', 'links');
      if (run.ticketUrl) links.appendChild(link(run.ticketUrl, 'Ticket'));
      if (run.mr) links.appendChild(link(run.mr, mrLabel(run.mr)));
      if (run.evidenceUrl) links.appendChild(link(run.evidenceUrl, 'Evidence'));
      if (links.children.length) c.foot.appendChild(links);
    }
  }

  // Stats use recorded visits only. A legacy record never receives fabricated zeroes.
  // stats-focus:start
  var statsDialog = document.getElementById('ticket-stats');

    else document.querySelector('#sec-history > summary').focus({ preventScroll: true });
  });
  // stats-focus:end
  function renderStats() {
    if (!board.selectedKey) return;

    if (current) { board.selectedRun = current; board.selectedAt = board.now; }
    var run = board.selectedRun;

    if (!current) content.appendChild(el('p', 'stats-note', 'This ticket is no longer in the latest snapshot. These are its last recorded stats.'));
    if (!stats.complete) content.appendChild(el('p', 'stats-note', 'Full history unavailable. Stage rows show recorded time only; earlier visits, blockers and bounces may be missing.'));
    var metrics = el('div', 'stats-grid');
    [['Running time', stats.complete ? stats.running : null], ['Total elapsed', stats.elapsed], ['Queued time', stats.complete ? stats.queued : null], ['Blocked time', stats.complete ? stats.blocked : null]].forEach(function (metric) {
      var box = el('div', 'stat'); add(box, el('span', null, metric[0]), el('b', null, duration(metric[1]))); metrics.appendChild(box);
    });

    var table = el('table'), head = el('thead'), header = el('tr'), body = el('tbody');
    add(header, el('th', null, 'Stage · all recorded visits'), el('th', null, 'Running time')); head.appendChild(header);
    PATH.forEach(function (stage, i) {

      add(row, el('td', null, PATH_LABELS[i] + (stats.visits[stage] > 1 ? ' · ' + stats.visits[stage] + ' visits' : '')), el('td', 'mono', duration(known ? stats.totals[stage] : stats.complete ? 0 : null)));
      body.appendChild(row);
    });
    add(table, head, body); content.appendChild(table);
    content.appendChild(el('p', 'stats-note', 'Running time excludes queued and blocked intervals. Total elapsed ends at completion, or at the recorded stop time. Legacy elapsed time starts at startedAt.'));
    content.appendChild(el('h3', null, 'Current blockers'));
    var currentBlockers = run.stage === 'queued' || run.stage === 'waiting' || run.stage === 'stopped' ? queueReasons(run).map(function (r) { return r.text; }) : isQuiet(run, board.selectedAt) ? ['No updates for 20+ minutes'] : [];
    content.appendChild(el('p', 'stats-note', currentBlockers.join('; ') || 'None'));

    });

    content.appendChild(blockers);

    var bounces = el('ul', 'stats-history');

      item.appendChild(el('small', null, new Date(bounce.at).toLocaleString() + ' · ' + bounce.reason)); bounces.appendChild(item);
    });

    content.appendChild(bounces);
    content.appendChild(el('p', 'stats-note', 'Measurements as of ' + new Date(board.selectedAt).toLocaleString() + '. Concurrent queue reasons share one interval.'));
    document.getElementById('stats-body').replaceChildren(content);
  }

  function updateCounts(animate) {
    var counts = summarize(board.runs, board.now);
    TILES.forEach(function (t) {
      var ref = board.refs.tiles[t[0]], value = counts[t[0]], from = Number(ref.num.textContent);
      ref.num.textContent = String(value);
      if (t[0] === 'attention') ref.tile.dataset.hot = String(value > 0);
      if (animate && from !== value) {
        var dir = value > from ? 1 : -1;
        ref.num.animate([{ transform: 'translateY(' + (dir * 40) + '%)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 260, easing: 'cubic-bezier(.2,.8,.2,1)' });
      }
    });
    FILTER_LABELS.forEach(function (f) {
      var ref = board.refs.buttons[f[0]];
      ref.count.textContent = String(counts[f[0]]);
      ref.button.setAttribute('aria-pressed', String(board.filter === f[0]));
    });
    var names = projects(board.runs), select = board.refs.project.select;
    if (board.project && names.indexOf(board.project) < 0) names.push(board.project);
    var wanted = JSON.stringify(names);
    if (select.dataset.names !== wanted) {
      select.dataset.names = wanted;
      select.replaceChildren(el('option', null, 'All projects'));
      select.firstChild.value = '';
      names.forEach(function (n) { var o = el('option', null, n); o.value = n; select.appendChild(o); });
    }
    select.value = board.project;
    board.refs.project.wrap.hidden = names.length < 2 && !board.project;
  }

  // Fade a removed card out from where it was, without holding up the layout of the rest.
  function ghost(node, rect) {
    if (!rect || !rect.width) return;
    var g = node.cloneNode(true);
    g.classList.add('ghost');
    g.setAttribute('aria-hidden', 'true');
    g.inert = true;
    g.style.cssText = 'position:fixed;margin:0;z-index:5;left:' + rect.left + 'px;top:' + rect.top + 'px;width:' + rect.width + 'px;height:' + rect.height + 'px';
    document.body.appendChild(g);
    var a = g.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'scale(.96)' }], { duration: 240, easing: 'ease-in' });
    a.onfinish = a.oncancel = function () { g.remove(); };
  }

  // Where focus goes when the focused run disappears: the next visible card, else the previous, else the section heading.
  function neighbours(node) {
    var list = [], s = node.nextElementSibling;
    while (s) { list.push(s); s = s.nextElementSibling; }
    s = node.previousElementSibling;
    while (s) { list.push(s); s = s.previousElementSibling; }
    return list;
  }
  function focusFallback(lost) {
    var shipped = document.getElementById('sec-history');
    if (lost.group === 'history' && !shipped.open) return shipped.querySelector('summary');
    var near = lost.near.filter(function (n) { return n.isConnected && !n.hidden && n.querySelector('button, a'); })[0];
    return near ? near.querySelector('button, a') : board.refs.heads[lost.group];
  }

  function patch(animate) {
    var now = board.now, cards = board.cards;
    // Filter first, then select the latest ten completions for this Board view.
    var runs = board.runs.filter(function (run) { return matches(run, board.filter, board.project, now); });
    var groups = layout(runs, now);
    var displayed = GROUPS.reduce(function (out, group) { return out.concat(groups[group]); }, []);
    animate = animate && !calm();
    var prev = new Map();
    cards.forEach(function (c, key) { prev.set(key, c.stage); });
    var diff = diffRuns(prev, displayed);
    var first = new Map();
    if (animate) cards.forEach(function (c, key) {
      c.el.getAnimations().forEach(function (a) { a.cancel(); });
      c.el.classList.remove('flash');
      first.set(key, c.el.getBoundingClientRect());
    });
    var active = document.activeElement, lost = null;
    diff.removed.forEach(function (key) {
      var c = cards.get(key);
      if (c.el.contains(active)) lost = { near: neighbours(c.el), group: c.el.dataset.group };
      if (animate) ghost(c.el, first.get(key));
      c.el.remove();
      cards.delete(key);
    });
    var added = new Set(diff.added), changed = new Set(diff.changed);
    GROUPS.forEach(function (g) {
      var list = board.refs.lists[g], prevEl = null, visible = 0;
      groups[g].forEach(function (run) {
        var c = cards.get(run.key);
        if (!c) { c = buildCard(run); cards.set(run.key, c); }
        c.stage = run.stage;
        updateCard(c, run, now);
        c.el.hidden = !matches(run, board.filter, board.project, now);
        if (!c.el.hidden) visible++;
        var want = prevEl ? prevEl.nextSibling : list.firstChild;
        if (c.el !== want) list.insertBefore(c.el, want);
        prevEl = c.el;
      });
      board.refs.counts[g].textContent = String(visible);
      board.refs.empties[g].hidden = visible > 0;
    });
    // Moving a node blurs it; put focus back, or on the nearest neighbour if its run went away.
    if (lost) focusFallback(lost).focus({ preventScroll: true });
    else if (active && active !== document.body && active.isConnected && document.activeElement !== active) active.focus({ preventScroll: true });
    if (active && active.isConnected && active.closest('details:not([open])')) active.closest('details').querySelector('summary').focus({ preventScroll: true });
    updateCounts(animate);
    renderStats();
    if (!animate) return;
    cards.forEach(function (c, key) {
      if (c.el.hidden) return;
      var was = first.get(key), now2 = c.el.getBoundingClientRect();
      if (added.has(key) || !was || !was.width) {
        c.el.animate([{ opacity: 0, transform: 'translateY(10px) scale(.98)' }, { opacity: 1, transform: 'none' }], { duration: 300, easing: 'cubic-bezier(.2,.8,.2,1)' });
        return;
      }
      var dx = was.left - now2.left, dy = was.top - now2.top;
      if (dx || dy) c.el.animate([{ transform: 'translate(' + dx + 'px,' + dy + 'px)' }, { transform: 'none' }], { duration: 280, easing: 'cubic-bezier(.2,.8,.2,1)' });
      if (changed.has(key)) { void c.el.offsetWidth; c.el.classList.add('flash'); }
    });
  }

  function setFilter(filter, project) {
    board.filter = filter;
    board.project = project;
    try { sessionStorage.setItem('factory-filter', filter); sessionStorage.setItem('factory-project', project); } catch (_) {}
    patch(true);
  }

  function startBoard() {
    function syncVisibility() { root.dataset.hidden = String(document.hidden); }
    syncVisibility();
    document.addEventListener('visibilitychange', syncVisibility);
    buildBoard();
    patch(false);
    if (fileMode || !shouldPoll(data, location.protocol)) {
      setSync('snapshot', 'Snapshot', 'generated ' + clock(board.syncedAt), 'Local snapshot generated ' + new Date(board.syncedAt).toLocaleString() + '. Refresh to load newer data.');
      return;
    }
    setSync('live', 'Live', 'synced ' + clock(board.syncedAt));
    var poller = createPoller({
      url: '/api/runs',
      interval: 10000,
      fetch: function (u, o) { return fetch(u, o); },
      setTimeout: function (f, ms) { return setTimeout(f, ms); },
      clearTimeout: function (t) { clearTimeout(t); },
      isHidden: function () { return document.visibilityState === 'hidden'; },
      valid: validSnapshot,
      onData: function (d) {
        board.runs = d.runs;
        board.now = Date.now();
        board.syncedAt = time(d.generatedAt) || board.now;
        setSync('live', 'Live', 'synced ' + clock(board.syncedAt));
        patch(true);
      },
      onError: function () {
        setSync('offline', 'Offline', 'last good ' + clock(board.syncedAt) + ' · retrying', 'Could not reach the board service. Showing data from ' + clock(board.syncedAt) + '; retrying every 10 seconds.');
      }
    });
    document.addEventListener('visibilitychange', poller.visibilityChanged);
    poller.start();
  }

    var heading = el('div');
    add(heading, el('p', 'eyebrow', 'Evidence'), el('h1', null, '#' + run.iid + ' · ' + (run.title || run.key)),
      el('div', 'sub', [run.project, run.branch ? run.branch + (run.base ? ' → ' + run.base : '') : ''].filter(Boolean).join(' · ')));
    var status = el('span', 'status');
    add(status, el('i', 'dot'), el('span', null, info.label + ' · ' + (run.stage === 'done' || run.stage === 'stopped' ? 'finished ' + ago(run.stageSince, now) + ' ago' : 'for ' + ago(run.stageSince, now))));
    var foot = el('div', 'card-foot');
    if (run.verdict) foot.appendChild(el('span', 'verdict ' + (run.verdict === 'PASS' ? 'pass' : 'fail'), run.verdict === 'PASS' ? 'Verified' : run.verdict));
    var links = el('div', 'links');
    if (run.ticketUrl) links.appendChild(link(run.ticketUrl, 'Ticket #' + run.iid));
    if (run.mr) links.appendChild(link(run.mr, mrLabel(run.mr)));
    if (links.children.length) foot.appendChild(links);
    add(hero, back, heading, status, run.note ? el('p', 'note', run.note) : null, foot);
    app.appendChild(hero);

    var grid = el('div', 'ev-grid');
    evidence.files.forEach(function (file, i) {
      var item = reveal(el('article', 'panel ev-card'), i + 1);
      item.appendChild(el('h2', null, file.name));
      if (file.kind === 'image') {
        var image = el('img');
        image.src = safeHref(file.url, false) || '';
        image.alt = file.name;
        image.loading = 'lazy';
        var preview = link(file.url, '');
        preview.appendChild(image);
        item.appendChild(preview);
      } else if (file.kind === 'video') {
        var video = el('video');
        video.src = safeHref(file.url, false) || '';
        video.controls = true;
        video.preload = 'metadata';
        item.appendChild(video);
      } else if (file.kind === 'text') {
        item.appendChild(el('pre', null, file.text));
        if (file.truncated) item.appendChild(el('p', 'sub', 'Preview limited to 64 KiB. Open the original for the full file.'));
      }
      var actions = el('div', 'links');
      actions.appendChild(link(file.url, 'Open original'));
      item.appendChild(actions);
      grid.appendChild(item);
    });
    if (!evidence.files.length) grid.appendChild(el('p', 'empty', 'No evidence files yet. Come back after the verifier has captured evidence.'));
    app.appendChild(grid);
    var f = el('footer', 'site-foot');
    add(f, el('span', null, 'Evidence files from this run. Videos play on demand; this page does not refresh.'), el('span', null, run.key));
    app.appendChild(f);
  }

  if (data.evidence) renderEvidence(data.evidence);
  else startBoard();
})();
</script>
</body>
</html>
